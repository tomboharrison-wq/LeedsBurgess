/* Layout: one-screen GIS workstation. Map with layer + basemap controls on the left, field notebook docked right, three-row transect profile under the map. */
:root{
  --paper:#f3f5f0; --panel:#ffffff; --ink:#18211c; --muted:#5a665f; --line:#d9dfd8; --soft:#eaeee8;
  --forest:#205B41; --forest-ink:#ffffff; --yellow:#FFE627;
  --good:#1f9e4a; --mid:#e07b10; --bad:#d8361c;
  --shadow:0 10px 30px rgba(20,40,30,.14);
  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1512; --panel:#161e1a; --ink:#e7eee9; --muted:#9aa8a0; --line:#2a3530; --soft:#1e2823;
  --forest:#3f9a6f; --forest-ink:#08110c; --good:#3cc56a; --mid:#ff9b3d; --bad:#ff6a4d; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0f1512; --panel:#161e1a; --ink:#e7eee9; --muted:#9aa8a0; --line:#2a3530; --soft:#1e2823;
  --forest:#3f9a6f; --forest-ink:#08110c; --good:#3cc56a; --mid:#ff9b3d; --bad:#ff6a4d; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:10px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:9px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #006DDF;outline-offset:2px}

.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:0;line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.steps{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px 4px 5px;font-weight:700;font-size:12.5px}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;border:1.5px solid rgba(0,0,0,.25)}
.step[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.step .ok{font-size:12px;margin-left:1px}

.app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px}
.mapcol{display:flex;flex-direction:column;gap:9px;min-height:0;min-width:0}
.mapwrap{position:relative;flex:1;min-height:0;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);background:#f2efe9}
#map{position:absolute;inset:0;background:#f2efe9 radial-gradient(#e2ded5 1px,transparent 1.2px) 0 0/14px 14px}
.leaflet-container{font-family:var(--f-ui)}
.pf{position:absolute;z-index:600;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ctl{top:12px;left:12px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;width:236px;max-height:calc(100% - 70px);overflow:auto}

// ---------- map ----------

function clipHist(){ if(!swipeOn) return; const el=hist.getElement(); if(!el) return;
  const wrap=$('mapwrap').getBoundingClientRect(); const r=el.getBoundingClientRect();
  const x=wrap.left+wrap.width*swipeX; const cut=Math.max(0,Math.min(r.width,x-r.left));

function toggleSwipe(on){ swipeOn=on; $('btnSwipe').setAttribute('aria-pressed',on); $('swipe').hidden=!on;
  if(on){ if(base!=='today'){ base='today'; document.querySelectorAll('#basemap button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b==='today')); luLayer.remove(); osm.setOpacity(1); $('lulegend').hidden=true;}
    hist.addTo(map); $('yearbadge').hidden=true; requestAnimationFrame(clipHist); showHint('Drag the yellow handle: 1900s on the left, today on the right.'); }
  else { const el=hist.getElement(); if(el) el.style.clipPath=''; hist.remove(); } }
$('btnSwipe').addEventListener('click',()=>toggleSwipe(!swipeOn));

(function(){const hd=$('swipeHd'); let drag=false;

  hd.addEventListener('pointerdown',e=>{drag=true; hd.setPointerCapture(e.pointerId); map.dragging.disable(); e.stopPropagation();});

})();

// ---------- profile ----------
let PROFILE=null, MIX=null;
const pct=k=>Math.max(1.8,Math.min(98.2,k/TOTAL*100));
function drawProfile(){
  let prev=0, html='';
  ZONES.forEach(z=>{const a=prev/TOTAL*100, b=z.r/TOTAL*100; html+=`<div class="seg" style="left:${a}%;width:${b-a}%;background:${z.c};color:${z.t}">${b-a>9?z.n:''}</div>`; prev=z.r;});
  $('bandPred').innerHTML=html;
  if(PROFILE){ const cats=PROFILE.cats, step=PROFILE.step/1000; let out='', i=0;
    while(i<cats.length){ let j=i; while(j<cats.length&&cats[j]===cats[i]) j++; const a=i*step/TOTAL*100, w=(j-i)*step/TOTAL*100; const c=LUC[cats[i]];
      out+=`<div class="seg" title="${c[0]}: ${(i*step).toFixed(1)} to ${(j*step).toFixed(1)} km" style="left:${a}%;width:${w+.05}%;background:${c[1]}"></div>`; i=j; }
    const end=cats.length*step/TOTAL*100; out+=`<div class="seg" style="left:${end}%;right:0;background:repeating-linear-gradient(45deg,var(--soft) 0 4px,var(--line) 4px 6px)" title="Beyond Barwick-in-Elmet"></div>`;
    $('bandLU').innerHTML=out; }
  $('bandFind').innerHTML=STOPS.map((s,i)=>{const v=st.votes[i];
    if(!v) return `<div class="find" style="left:${pct(s.km)}%;opacity:.45" title="Stop ${i+1}">${i+1}</div>`;
    const V=VERD[v]; return `<div class="find" style="left:${pct(s.km)}%;background:${V.c};color:#fff" title="Stop ${i+1}: ${V.t}">${V.s}</div>`;}).join('');
  $('axis').innerHTML=[0,2,4,6,8,10].map(k=>`<span style="left:${k/TOTAL*100}%">${k} km</span>`).join('');
}
function moveCursor(i){ const c=$('cursor'); if(i<0||i>4){c.hidden=true;return;} c.hidden=false; const band=$('bandPred').getBoundingClientRect(), tr=$('track').getBoundingClientRect(); c.style.marginLeft='0px'; c.style.left=(band.left-tr.left+band.width*STOPS[i].km/TOTAL-1)+'px'; }

// ---------- notebook ----------
function head(chip,chipBg,chipFg,title,meta){ $('nbhead').innerHTML=`<div class="chip" style="background:${chipBg};color:${chipFg}">${chip}</div><div style="min-width:0"><h2>${title}</h2><div class="meta">${meta}</div></div>`; }
function body(html){ const b=$('nbbody'); b.classList.remove('enter'); b.innerHTML=html; void b.offsetWidth; b.classList.add('enter'); b.scrollTop=0; }

function renderBrief(){
  head('★','var(--yellow)','#18211c','Your mission',`Briefing · 5 stops · ${LINE_KM.toFixed(1)} km`);
  body(`
   <div class="sec brief"><p>Travel along a <b>transect</b> from Trinity Leeds in the CBD to the village of Barwick-in-Elmet. At each stop:</p>
   <ol><li><b>Look</b> at the photos, today's map and the map from around 1900.</li><li><b>Record</b> the land uses you can see.</li><li><b>Decide</b>: does it fit what Burgess predicts?</li></ol></div>
   <div class="sec slider"><h3>Before you go</h3><p>How well do you think Leeds will fit the Burgess model?</p>
     <input type="range" id="before" min="0" max="100" value="${st.before}" aria-label="Your first guess">
     <div class="ends"><span>Not at all</span><span>Partly</span><span>Perfectly</span></div></div>
   <div class="sec"><h3>Your GIS toolkit</h3><div class="feat">
     <div><b>⇆ Then and now</b>Swipe between the map from around 1900 and today.</div>
     <div><b>Land use map</b>Real land use from OpenStreetMap, coloured by type.</div>
     <div><b>Burgess rings</b>The model's prediction laid over the real city.</div>
     <div><b>📏 Measure</b>Check distances, like the scale bar on an OS map.</div></div></div>
   <button class="go" id="start">Start the fieldtrip →</button>
   <p style="font-size:12.5px;color:var(--muted);margin:0">Tip: use <span class="kbd">←</span> <span class="kbd">→</span> to move between stops.</p>`);
  $('before').addEventListener('input',e=>{st.before=+e.target.value; save();});
  $('start').addEventListener('click',()=>go(0));
}
function mixHtml(i){ if(!MIX) return ''; const m=MIX[i]; const order=['C','H','I','S','G','W','F','A','-'];
  const parts=order.filter(k=>m[k]>0).map(k=>({k,v:m[k]}));
  return `<div class="sec"><h3>Land use within 500 m (OpenStreetMap)</h3>
   <div class="mixbar" role="img" aria-label="Land use mix">${parts.map(p=>`<span style="width:${p.v}%;background:${LUC[p.k][1]}" title="${LUC[p.k][0]}: ${p.v}%"></span>`).join('')}</div>
   <div class="mixleg">${parts.filter(p=>p.v>=3).sort((a,b)=>b.v-a.v).map(p=>`<span><i class="sw" style="background:${LUC[p.k][1]}"></i>${LUC[p.k][0]} ${p.v}%</span>`).join('')}</div></div>`; }

function renderStop(i){
  const s=STOPS[i], z=ZONES[s.z];
  head(i+1,z.c,z.t,s.name,`Stop ${i+1} of 5 · ${s.km.toFixed(1)} km from the CBD`);
  const pi=st.photo[i]||0, sel=st.lu[i]||[], checked=st.checked[i], v=st.votes[i]; const ph=s.photos[pi];
  const luHtml=LU.map(l=>{const on=sel.includes(l); let cls='lu';
    if(checked){ const real=s.lu.includes(l); if(on&&real) cls+=' hit'; else if(on&&!real) cls+=' miss'; else if(!on&&real) cls+=' missed'; }
    return `<button class="${cls}" aria-pressed="${on}" data-l="${l}">${l}</button>`;}).join('');
  body(`
   <span class="pred"><i style="background:${z.c}"></i>Burgess predicts: ${z.n.toUpperCase()}</span>
   <div class="gallery"><div class="main"><img class="${ph[2]?'map':''}" src="${ph[0]}" alt="${ph[1]}"><span class="cap">${ph[1]}</span>${ph[2]==='then'?'<span class="then">around 1900</span>':''}</div>
     <div class="thumbs">${s.photos.map((p,k)=>`<button aria-pressed="${k===pi}" data-k="${k}" aria-label="${p[1]}"><img src="${p[0]}" alt="">${p[2]==='os'?'<span class="os">MAP NOW</span>':p[2]==='then'?'<span class="os">1900s</span>':''}</button>`).join('')}</div></div>
   <div class="thenbox"><div class="sec"><h3>Then and now</h3><p>${s.then}</p><p style="margin-top:6px;font-weight:700">${s.q}</p></div>
     <div class="btnrow" style="margin-top:8px"><button class="go small" id="swipeHere" style="background:#3b2f17;color:#f4ecd6">⇆ Compare here</button></div></div>
   <div class="sec"><h3>1 · Record: what land uses can you see?</h3><div class="chips" id="chips">${luHtml}</div></div>
   <div class="sec"><h3>2 · Decide: does it fit the model?</h3>
     <div class="vote" id="vote"><button class="f" data-v="F" aria-pressed="${v==='F'}">✔ Fits</button><button class="p" data-v="P" aria-pressed="${v==='P'}">~ Partly</button><button class="n" data-v="N" aria-pressed="${v==='N'}">✖ Does not fit</button></div></div>
   ${checked?revealHtml(i):`<button class="go" id="check" ${v?'':'disabled'}>3 · Check with the geographers</button>`}
   <div class="btnrow"><button class="go alt" id="prev">← ${i===0?'Briefing':'Stop '+i}</button><button class="go" id="next">${i===4?'Verdict ⚖':'Travel to stop '+(i+2)+' →'}</button></div>`);
  document.querySelectorAll('.thumbs button').forEach(b=>b.addEventListener('click',()=>{st.photo[i]=+b.dataset.k; renderStop(i);}));
  document.querySelectorAll('#chips .lu').forEach(b=>b.addEventListener('click',()=>{ if(st.checked[i]) return; const l=b.dataset.l; const a=st.lu[i]||[]; st.lu[i]=a.includes(l)?a.filter(x=>x!==l):a.concat(l); save(); renderStop(i);}));
  document.querySelectorAll('#vote button').forEach(b=>b.addEventListener('click',()=>{st.votes[i]=b.dataset.v; save(); renderStop(i); drawProfile(); drawSteps();}));
  const c=$('check'); if(c) c.addEventListener('click',()=>{st.checked[i]=true; save(); renderStop(i);});
  $('swipeHere').addEventListener('click',()=>{ map.flyTo(s.p,.75,{duration:.8}); setTimeout(()=>{ if(!swipeOn) toggleSwipe(true); else clipHist(); },850); });
  $('prev').addEventListener('click',()=>go(i-1));
  $('next').addEventListener('click',()=>go(i+1));
}
function revealHtml(i){
  const s=STOPS[i], V=VERD[s.verdict], mine=st.votes[i];
  return `<div class="reveal" style="border-left-color:${V.c}"><b class="v" style="color:${V.c}">Geographers say: ${V.s} ${V.t}</b>
    <p style="margin:0 0 6px">${s.why}</p><p style="margin:0;font-weight:700">${mine===s.verdict?'You agreed. Now explain why in your book.':'You chose "'+VERD[mine].t+'". Can you defend your answer with evidence?'}</p></div>
   ${mixHtml(i)}
   <div class="datacard"><div><div class="k">Ward</div><div style="font-weight:800;font-size:14px">${s.ward}</div></div><div><div class="k">Density 2021</div><div class="v">${s.dens.toLocaleString('en-GB')}<span style="font-size:12px;font-weight:600"> /km²</span></div></div></div>
   <p style="margin:0;font-size:13px;color:var(--muted)">Ringed chips = you spotted it. Red = not really here. Dashed = you missed it.</p>`;
}
function label(v){return v>80?'fits perfectly':v>60?'mostly fits':v>40?'partly fits':v>20?'only a little':'does not fit at all';}
function renderVerdict(){
  head('⚖','var(--forest)','var(--forest-ink)','Your verdict','Does Leeds fit the Burgess model?');
  const rows=STOPS.map((s,i)=>{const v=st.votes[i]; const g=VERD[s.verdict];
    return `<tr><td><b>${i+1}</b> ${s.name}</td><td>${ZONES[s.z].n}</td><td style="color:${v?VERD[v].c:'var(--muted)'};font-weight:800">${v?VERD[v].s+' '+VERD[v].t:'not decided'}</td><td style="color:${g.c};font-weight:800">${g.s}</td></tr>`;}).join('');
  const agree=STOPS.filter((s,i)=>st.votes[i]===s.verdict).length;
  const fits=STOPS.filter((s,i)=>st.votes[i]==='F').map(s=>s.name), nots=STOPS.filter((s,i)=>st.votes[i]==='N'||st.votes[i]==='P').map(s=>s.name);
  const starter=()=>`Overall, Leeds ${st.after>66?'mostly fits':st.after>33?'partly fits':'does not really fit'} the Burgess model. ${fits.length?'It fits at '+fits.join(' and ')+', where... ':''}${nots.length?'However, '+nots.join(' and ')+' '+(nots.length>1?'do':'does')+' not fit as well, because... ':''}This is because Leeds' history...`;
  body(`
   <div class="sec"><h3>Your decisions</h3><div style="overflow-x:auto"><table class="sum"><thead><tr><th>Stop</th><th>Burgess</th><th>You</th><th>Geog.</th></tr></thead><tbody>${rows}</tbody></table></div>
     <p style="margin-top:6px;font-weight:700">You agreed with the geographers at ${agree} of 5 stops.</p></div>
   <div class="sec"><h3>What the land use profile shows</h3><p>Look at the <b>Real land use</b> row under the map: shops and offices in the centre, then housing broken up by parks and woods, then farmland from about 8 km. The general pattern fits Burgess, but the housing is not in neat rings.</p></div>
   <div class="sec slider"><h3>After the trip</h3><p>Move the slider to your NEW view. Your first guess was <b>${label(st.before)}</b>.</p>
     <input type="range" id="after" min="0" max="100" value="${st.after}" aria-label="Your new view">
     <div class="ends"><span>Not at all</span><span>Partly</span><span>Perfectly</span></div>
     <p id="now" style="margin:4px 0 0;font-weight:700">Now: ${label(st.after)}</p></div>
   <div class="sec"><h3>Start your 8-mark answer</h3><p style="margin-bottom:6px"><i>Evaluate how well the Burgess model fits Leeds. (8)</i></p>
     <div class="starter" id="starter">${starter()}</div>
     <div class="btnrow" style="margin-top:8px"><button class="go alt" id="copy">Copy sentence starter</button></div></div>
   <div class="btnrow"><button class="go alt" id="back">← Stop 5</button><button class="go alt" id="reset">Start again</button></div>
   <details class="src"><summary>About the maps, data and photos</summary><p>Today's map and land use: © OpenStreetMap contributors (ODbL), October 2026. Historic map: Ordnance Survey six-inch map, surveyed 1888 to 1913, reproduced with the permission of the National Library of Scotland (CC BY). Population density: ONS Census 2021, table TS006, by ward. OS map extracts: Digimap for Schools, © Crown copyright, for school use. Street-level images of New York Road, Parklands, Scholes and the New Inn: Google Street View. Other photos via Wikimedia Commons (CC BY-SA): Mtaylor848 (Trinity Leeds, Briggate, Seacroft, Scholes Main Street), Chris Heaton (North Parkway), John Fergusson (Barwick maypole), JThomas (farmland near Scholes). The land use mix samples a 500 m circle round each stop. Burgess ring sizes are drawn to match the stops for this lesson; the real model has no fixed distances.</p></details>`);
  $('after').addEventListener('input',e=>{st.after=+e.target.value; save(); $('now').textContent='Now: '+label(st.after); $('starter').textContent=starter();});
  $('copy').addEventListener('click',()=>{const t=$('starter').textContent; navigator.clipboard.writeText(t).then(()=>{$('copy').textContent='Copied';}).catch(()=>{const r=document.createRange(); r.selectNodeContents($('starter')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); $('copy').textContent='Selected: press Ctrl+C';});});
  $('back').addEventListener('click',()=>go(4));
  $('reset').addEventListener('click',()=>{st.votes={};st.lu={};st.checked={};st.photo={};st.before=50;st.after=50;save();trail.setLatLngs([]);drawProfile();go(-1);});
}

// ---------- navigation + animation ----------
let raf, visited=0;
function go(i){
  i=Math.max(-1,Math.min(5,i)); const from=st.i; st.i=i;
  document.querySelectorAll('.pin').forEach((p,k)=>p.classList.toggle('on',k===i));
  if(i>=0&&i<5){
    if(!map.hasLayer(van)) van.addTo(map);
    const target=STOPS[i].p, start=van.getLatLng();
    animateVan(start,target, i>visited);
    visited=Math.max(visited,i);
    map.flyTo(target,0.5,{duration:1.1});
  } else { map.flyToBounds(routeBounds,Object.assign({duration:.9},FITPAD())); if(i===-1) van.remove(); }
  moveCursor(i); drawSteps();
  if(i===-1) renderBrief(); else if(i===5) renderVerdict(); else renderStop(i);
}
function animateVan(a,b,extend){ cancelAnimationFrame(raf); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finish=()=>{van.setLatLng(b); if(extend||!trail.getLatLngs().length) trail.setLatLngs([ORIGIN,farthest(b)]);};
  if(reduce){finish();return;}
  const t0=performance.now(), dur=1100; (function f(t){const k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const p=L.latLng(a.lat+(b.lat-a.lat)*e,a.lng+(b.lng-a.lng)*e); van.setLatLng(p);
    if(extend) trail.setLatLngs([ORIGIN,p]);
    if(k<1) raf=requestAnimationFrame(f); else finish();})(t0);}
function farthest(b){ const pts=trail.getLatLngs(); if(!pts.length) return b; return km(ORIGIN,pts[1])>km(ORIGIN,b)?pts[1]:b; }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.getAttribute('role')==='slider') return; if(e.key==='ArrowRight') go(st.i+1); if(e.key==='ArrowLeft') go(st.i-1);});

Promise.all([fetch('profile.json').then(r=>r.json()).catch(()=>null),fetch('mix.json').then(r=>r.json()).catch(()=>null)]).then(([p,m])=>{PROFILE=p; MIX=m; drawProfile(); if(st.i>=0&&st.i<5&&st.checked[st.i]) renderStop(st.i);});
drawProfile();
const hm=/^#stop([1-5])$/.exec(location.hash||'');
go(hm?+hm[1]-1:-1);
window.addEventListener('hashchange',()=>{const m=/^#stop([1-5])$/.exec(location.hash||''); if(m) go(+m[1]-1);});
})();
</script>

</body>
</html>
